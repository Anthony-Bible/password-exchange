# One KSA for every Cloud SQL workload in `default` (both phases). Workload
# Identity maps it to the GSA created by deploy/terraform (#563), which has
# roles/cloudsql.client for the cloud-sql-proxy sidecars.
# Rendered by the dev pipeline only (CI skips it for prod) so a single ArgoCD
# app owns it; Prune=false keeps it alive for prod pods if that ever changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: password-exchange
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    iam.gke.io/gcp-service-account: password-exchange-sql@gen-lang-client-0479899208.iam.gserviceaccount.com
# The app images on GHCR are private. The `default` KSA carries this pull
# secret; pods moved onto this KSA lose it unless it is repeated here.
imagePullSecrets:
  - name: regcred
