basePath: /api/v1
definitions:
  api.initiateUploadRequest:
    properties:
      chunkSize:
        type: integer
      contentType:
        type: string
      filename:
        type: string
      messageID:
        type: string
      totalSize:
        type: integer
    type: object
  models.APIInfoResponse:
    properties:
      documentation:
        type: string
      endpoints:
        additionalProperties:
          type: string
        type: object
      features:
        additionalProperties:
          type: boolean
        type: object
      version:
        type: string
    type: object
  models.HealthCheckResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  models.MessageAccessInfoResponse:
    properties:
      exists:
        description: True if the message exists and has not yet been consumed.
        type: boolean
      expiresAt:
        description: Time at which the message will be automatically deleted. Null
          for legacy messages.
        type: string
      hasBeenAccessed:
        description: True if the message has already been viewed at least once.
        type: boolean
      isClientEncrypted:
        description: True when the stored content is client-side encrypted (E2E mode);
          decryption happens in the browser.
        type: boolean
      messageId:
        description: Unique ID of the message.
        type: string
      requiresPassphrase:
        description: True if the message requires a passphrase before it can be decrypted.
        type: boolean
    type: object
  models.MessageDecryptRequest:
    properties:
      decryptionKey:
        description: |-
          Optional. Base64url-encoded decryption key. Omit for client-encrypted (E2E) messages
          where decryption happens client-side. Max 4096 characters.
        maxLength: 4096
        type: string
      passphrase:
        description: Optional. Passphrase required if the message was created with
          one.
        type: string
    type: object
  models.MessageDecryptResponse:
    properties:
      content:
        description: Decrypted message content. For E2E messages this is the raw ciphertext;
          the client decrypts it.
        type: string
      decryptedAt:
        description: Timestamp of this decryption.
        type: string
      expiresAt:
        description: Time at which the message will be automatically deleted. Null
          for legacy messages.
        type: string
      isClientEncrypted:
        description: True when the content is client-side encrypted (E2E mode).
        type: boolean
      maxViewCount:
        description: Maximum allowed views before deletion. 0 means unlimited.
        type: integer
      messageId:
        description: Unique ID of the message.
        type: string
      viewCount:
        description: Number of times this message has been viewed.
        type: integer
    type: object
  models.MessageSubmissionRequest:
    properties:
      additionalInfo:
        description: Optional. Free-form text included in the notification email body.
        type: string
      antiSpamAnswer:
        description: |-
          Optional. Answer to the anti-spam question identified by questionId.
          Required when sendNotification is true.
        type: string
      content:
        description: Required. The message content to encrypt and store. 1–10000 characters.
        minLength: 1
        type: string
      expirationHours:
        description: |-
          Optional. Custom expiration in hours. When 0 or omitted the server default (168 h / 7 days) applies.
          Valid range: 1–2160 (1 hour to 90 days).
        maximum: 2160
        minimum: 0
        type: integer
      isClientEncrypted:
        description: |-
          Optional. Set to true if the content is already client-side encrypted (E2E mode).
          When true, the server stores the ciphertext as-is without re-encrypting.
        type: boolean
      maxViewCount:
        description: Optional. Maximum number of times the message may be viewed before
          it is deleted. 0 means unlimited.
        maximum: 100
        minimum: 0
        type: integer
      passphrase:
        description: Optional. Passphrase that the recipient must supply before decrypting.
          Max 500 characters.
        maxLength: 500
        type: string
      questionId:
        description: |-
          Optional. ID of the anti-spam question the user answered.
          Required when sendNotification is true.
        type: integer
      recipient:
        allOf:
        - $ref: '#/definitions/models.Recipient'
        description: Optional. Recipient details. Required when sendNotification is
          true.
      sendNotification:
        description: |-
          Optional. Set to true to send an email notification to the recipient.
          Requires sender and recipient to be set.
        type: boolean
      sender:
        allOf:
        - $ref: '#/definitions/models.Sender'
        description: Optional. Sender details. Required when sendNotification is true.
      turnstileToken:
        description: Optional. Cloudflare Turnstile token for bot protection. Max
          2048 characters.
        maxLength: 2048
        type: string
    required:
    - content
    type: object
  models.MessageSubmissionResponse:
    properties:
      decryptUrl:
        description: Full URL the recipient should visit to decrypt the message.
        type: string
      expiresAt:
        description: Time at which the message will be automatically deleted. Null
          for legacy messages.
        type: string
      isClientEncrypted:
        description: True when the stored content is client-side encrypted (E2E mode).
        type: boolean
      key:
        description: Base64url-encoded decryption key. Include this in the share URL
          fragment so it never reaches the server.
        type: string
      messageId:
        description: Unique ID of the created message.
        type: string
      notificationSent:
        description: True if an email notification was successfully sent to the recipient.
        type: boolean
      webUrl:
        description: Web UI URL for the message (without the key fragment).
        type: string
    type: object
  models.Recipient:
    properties:
      email:
        description: Required. Recipient's email address.
        type: string
      name:
        description: Optional. Recipient's display name. 1–100 characters.
        maxLength: 100
        minLength: 1
        type: string
    required:
    - email
    type: object
  models.Sender:
    properties:
      email:
        description: Required. Sender's email address.
        type: string
      name:
        description: Required. Sender's display name. 1–100 characters.
        maxLength: 100
        minLength: 1
        type: string
    required:
    - email
    - name
    type: object
  models.StandardErrorResponse:
    properties:
      details:
        additionalProperties: true
        type: object
      error:
        type: string
      message:
        type: string
      path:
        type: string
      timestamp:
        type: string
    type: object
host: password.exchange
info:
  contact:
    name: Password Exchange Support
    url: https://github.com/Anthony-Bible/password-exchange
  description: |-
    Secure password sharing service that allows users to submit encrypted messages and share them through unique, one-time access URLs.
    The service provides optional email notifications and passphrase protection for enhanced security.

    ## Email Reminder System

    The service includes an automated email reminder system that runs via scheduled jobs (CronJob in Kubernetes).
    This system automatically sends reminder emails to recipients who haven't viewed their secure messages after
    a configurable time period. The reminder system is not exposed through REST API endpoints but operates as
    a background service with configurable timing, retry logic, and resilience patterns.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Password Exchange API
  version: 1.0.0
paths:
  /files/{fileID}:
    get:
      description: Downloads and decrypts a file. The AES-256 decryption key must
        be supplied via the X-File-Key header as a base64url-encoded string. The key
        is kept out of the URL to prevent it appearing in server logs or browser history.
        Direct browser navigation will not work — callers must use fetch() or XMLHttpRequest.
      parameters:
      - description: File ID
        in: path
        name: fileID
        required: true
        type: string
      - description: Base64url-encoded AES-256 decryption key
        in: header
        name: X-File-Key
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Decrypted file content with Content-Disposition attachment
            header
          schema:
            type: file
        "400":
          description: Missing or invalid key
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
      summary: Download a file
      tags:
      - Files
  /files/{fileID}/chunks:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a single chunk as multipart/form-data. Chunks must be uploaded
        in order starting from index 1. The upload is complete when chunkIndex equals
        totalChunks.
      parameters:
      - description: File ID returned by the initiate endpoint
        in: path
        name: fileID
        required: true
        type: string
      - description: Upload session ID
        in: formData
        name: sessionID
        required: true
        type: string
      - description: 1-based chunk index
        in: formData
        name: chunkIndex
        required: true
        type: integer
      - description: Total number of chunks
        in: formData
        name: totalChunks
        required: true
        type: integer
      - description: Chunk binary data
        in: formData
        name: data
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: fileID, chunkIndex, and done flag
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "404":
          description: Upload session not found
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "410":
          description: Upload session expired
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
      summary: Upload a file chunk
      tags:
      - Files
  /files/initiate:
    post:
      consumes:
      - application/json
      description: Creates an upload session for a file associated with a message.
        Returns a fileID, sessionID, and base64url-encoded AES-256 encryption key
        for use when uploading chunks.
      parameters:
      - description: Upload initiation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.initiateUploadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: fileID, sessionID, and encodedKey
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
      summary: Initiate a chunked file upload
      tags:
      - Files
  /health:
    get:
      consumes:
      - application/json
      description: Returns the health status of the API and its dependencies
      produces:
      - application/json
      responses:
        "200":
          description: Service health status
          schema:
            $ref: '#/definitions/models.HealthCheckResponse'
      summary: Health check
      tags:
      - Utility
  /info:
    get:
      consumes:
      - application/json
      description: Returns information about the API including available endpoints
        and features
      produces:
      - application/json
      responses:
        "200":
          description: API information
          schema:
            $ref: '#/definitions/models.APIInfoResponse'
      summary: API information
      tags:
      - Utility
  /messages:
    post:
      consumes:
      - application/json
      description: Creates a new encrypted message that can be accessed via a unique
        URL. Optionally sends email notifications to the recipient.
      parameters:
      - description: Message submission request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.MessageSubmissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Message successfully created
          schema:
            $ref: '#/definitions/models.MessageSubmissionResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "422":
          description: Anti-spam verification failed
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
      summary: Submit a new message
      tags:
      - Messages
  /messages/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves information about a message including whether it exists,
        requires a passphrase, and has been accessed.
      parameters:
      - description: Message ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Base64-encoded decryption key
        format: byte
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Message information retrieved
          schema:
            $ref: '#/definitions/models.MessageAccessInfoResponse'
        "404":
          description: Message not found or expired
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
      summary: Get message access information
      tags:
      - Messages
  /messages/{id}/decrypt:
    post:
      consumes:
      - application/json
      description: Decrypts and retrieves the message content. This is a one-time
        operation that will delete the message after successful decryption.
      parameters:
      - description: Message ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Decryption request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.MessageDecryptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message successfully decrypted
          schema:
            $ref: '#/definitions/models.MessageDecryptResponse'
        "401":
          description: Invalid passphrase
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "404":
          description: Message not found or expired
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "410":
          description: Message already consumed
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.StandardErrorResponse'
      summary: Decrypt a message
      tags:
      - Messages
schemes:
- https
- http
swagger: "2.0"
